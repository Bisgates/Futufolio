[project]
name = "futu-portfolio-rebalance"
version = "0.1.0"
description = "macOS Accessibility automation for FutuNiuniu portfolio rebalancing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
macos = [
  "pyobjc>=10; sys_platform == 'darwin'",
]

[project.scripts]
futu-portfolio = "futu_utils.cli:run"
futu-rebalance = "futu_utils.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["futu_utils"]
