[project]
name = "futufolio"
version = "0.1.0"
description = "macOS Accessibility automation for FutuNiuniu portfolio rebalancing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
macos = [
  "pyobjc>=10; sys_platform == 'darwin'",
]

[project.scripts]
futufolio = "futufolio.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["futufolio"]
